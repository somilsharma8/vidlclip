[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vid-clipper"
version = "0.1.0"
description = "Download a YouTube video or clip at 1080p (720p fallback)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "imageio-ffmpeg>=0.5.1",
]

[project.scripts]
vidclip = "vidclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
